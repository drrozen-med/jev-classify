name: registry-metadata

# Records what the registry actually published (version, tarball, integrity)
# into registry-metadata.json, so consumers can pin the exact artifact in
# their lockfile without needing registry read access locally.
on:
  workflow_run:
    workflows: ["publish"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch package metadata from GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm view @drrozen-med/jev-classify \
            --registry=https://npm.pkg.github.com \
            --json > /tmp/metadata.json
          node -e '
            const fs = require("fs");
            const raw = JSON.parse(fs.readFileSync("/tmp/metadata.json", "utf8"));
            const versions = raw.versions ?? {};
            const latest = raw["dist-tags"]?.latest;
            const v = versions[latest];
            const out = {
              name: raw.name,
              latest,
              versions: Object.keys(versions).sort(),
              dist: latest
                ? { version: latest, tarball: v.dist.tarball, integrity: v.dist.integrity, shasum: v.dist.shasum }
                : null,
            };
            fs.writeFileSync("registry-metadata.json", JSON.stringify(out, null, 2) + "\n");
            console.log("recorded", out.latest, out.dist?.integrity);
          '
      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry-metadata.json
          git diff --staged --quiet || git commit -m "chore: record published registry metadata"
          git push
